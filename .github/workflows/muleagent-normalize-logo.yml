name: Corrige logo MuleAgent sin cambiar diseño
on:
  push:
    branches: [feat/etapa6-validacion-apk]
    paths:
      - '.github/workflows/muleagent-normalize-logo.yml'
permissions:
  contents: write
jobs:
  normalize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Convertir JPEG mal nombrado a PNG verdadero (pixeles idénticos)
        run: |
          set -euo pipefail
          python3 -m pip install --quiet Pillow==11.3.0
          python3 - <<'PY'
          from PIL import Image
          from pathlib import Path
          from tempfile import NamedTemporaryFile
          import os

          names = [
              'apps/muleagent/android/app/src/main/res/drawable-nodpi/muleagent_logo.png',
              'apps/operador/assets/LOGO_MULEAGENT_V1.png',
          ]
          for name in names:
              p = Path(name)
              with Image.open(p) as original:
                  original_pixels = original.convert('RGB')
                  pixels = original_pixels.tobytes()
                  profile = original.info.get('icc_profile')
                  print(f'{name}: {original.format} {original.size}')
                  with NamedTemporaryFile(dir=p.parent, suffix='.png', delete=False) as tmp:
                      out = Path(tmp.name)
                  options = {'format': 'PNG', 'optimize': True}
                  if profile:
                      options['icc_profile'] = profile
                  original_pixels.save(out, **options)
              with Image.open(out) as converted:
                  converted.load()
                  assert converted.format == 'PNG'
                  assert converted.convert('RGB').tobytes() == pixels, 'Pixel change prohibited'
              assert out.read_bytes().startswith(b'\x89PNG\r\n\x1a\n')
              os.replace(out, p)
              print(f'{name}: now valid PNG, exactly same decoded pixels')
          PY
      - name: Guardar archivos oficiales corregidos en el repositorio
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- apps/muleagent/android/app/src/main/res/drawable-nodpi/muleagent_logo.png apps/operador/assets/LOGO_MULEAGENT_V1.png
          if git diff --cached --quiet; then
            echo "No logo modifications needed"
            exit 0
          fi
          git commit -m "Fix assets: convertir logo oficial JPEG disfrazado a PNG real sin cambiar pixeles"
          git push origin "HEAD:feat/etapa6-validacion-apk"
