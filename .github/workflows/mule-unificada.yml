name: MuleAgent modular
on:
  push:
    branches: [refactor/mule-unificada, feat/interfaz-muleagent-v1]
    paths:
      - 'apps/**'
      - 'packages/**'
      - '.github/workflows/**'
  pull_request:
    branches: [refactor/mule-unificada]
    paths:
      - 'apps/**'
      - 'packages/**'
      - '.github/workflows/**'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mule-modular-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Profile capability rules
        working-directory: packages/mule_profiles
        run: |
          dart pub get
          dart analyze
          dart test
      - name: Shared data regression
        working-directory: packages/mule_data
        run: |
          dart pub get
          dart analyze
          dart test
      - name: Administrator data regression
        working-directory: packages/admin_data
        run: |
          dart pub get
          dart analyze
          dart test
      - name: Capture and storage regression
        working-directory: apps/operador
        run: |
          flutter pub get
          flutter analyze
          flutter test --timeout=120s
      - name: Receiver interoperability regression
        working-directory: apps/administrador
        run: |
          flutter pub get
          flutter analyze
          flutter test --timeout=120s
      - name: Unified application and migration tests
        working-directory: apps/muleagent
        run: |
          flutter pub get
          flutter analyze
          flutter test --timeout=120s
      - name: Compile the single Android entry point
        working-directory: apps/muleagent
        run: |
          set -o pipefail
          flutter build apk --debug 2>&1 | tee build-check.log
      - name: Verify APK signature and Android identity
        working-directory: apps/muleagent
        shell: bash
        run: |
          set -euo pipefail
          apk=build/app/outputs/flutter-apk/app-debug.apk
          test -s "$apk"
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          signer="$(find "$sdk_root/build-tools" -name apksigner | sort -V | tail -n 1)"
          aapt="$(find "$sdk_root/build-tools" -name aapt | sort -V | tail -n 1)"
          test -n "$signer" && test -n "$aapt"
          mkdir -p build/release-candidate
          "$signer" verify --verbose --print-certs "$apk" | tee build/release-candidate/apk-certificate.txt
          "$aapt" dump badging "$apk" | tee build/release-candidate/apk-badging.txt
          grep -q "package: name='com.muleagent.operador' versionCode='8' versionName='1.2.1'" build/release-candidate/apk-badging.txt
          grep -Eq "(V2 Signer|Signer #1): certificate SHA-256 digest:" build/release-candidate/apk-certificate.txt
      - name: Package stage 6 APK and test instructions
        shell: bash
        env:
          SIGNING_SOURCE: github-actions-ephemeral-debug-keystore
        run: python3 scripts/package_muleagent_rc.py
      - name: Retain APK ZIP for supervised Android field tests
        uses: actions/upload-artifact@v4
        with:
          name: ConduceMula-MuleAgent-Stage6-RC
          path: apps/muleagent/build/release-candidate/*.zip
          if-no-files-found: error
          retention-days: 30
      # The universal debug APK includes three CPU architectures and exceeds
      # the Google Drive connector's direct-upload 100 MiB limit. Build a
      # separate, still unmodified application for modern ARM64 Android phones.
      - name: Build small standalone arm64 test APK
        working-directory: apps/muleagent
        shell: bash
        run: |
          set -euo pipefail
          flutter build apk --debug --target-platform=android-arm64
          apk=build/app/outputs/flutter-apk/app-debug.apk
          test -s "$apk"
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          signer="$(find "$sdk_root/build-tools" -name apksigner | sort -V | tail -n 1)"
          aapt="$(find "$sdk_root/build-tools" -name aapt | sort -V | tail -n 1)"
          "$signer" verify --print-certs "$apk"
          "$aapt" dump badging "$apk" | grep -q "package: name='com.muleagent.operador' versionCode='8' versionName='1.2.1'"
          unzip -Z1 "$apk" | grep -q '^lib/arm64-v8a/'
          if unzip -Z1 "$apk" | grep -Eq '^lib/(x86_64|armeabi-v7a)/'; then
            echo "Unexpected non-ARM64 native library in mobile APK" >&2
            exit 1
          fi
          size=$(stat -c%s "$apk")
          echo "APK bytes: $size"
          test "$size" -lt 104857600
          mkdir -p build/drive-apk
          cp "$apk" build/drive-apk/MuleAgent-ConduceMula-1.2.1-b8-arm64-debug.apk
          sha256sum build/drive-apk/*.apk
      - name: Retain direct-install arm64 APK for Google Drive
        uses: actions/upload-artifact@v4
        with:
          name: ConduceMula-Android-ARM64-APK-Directa
          path: apps/muleagent/build/drive-apk/*.apk
          compression-level: 6
          if-no-files-found: error
          retention-days: 30
      - name: Retain native compile diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mule-stage2-build-log
          path: apps/muleagent/build-check.log
          if-no-files-found: ignore
